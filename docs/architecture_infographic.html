<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Fixer — Architecture Infographic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1600px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-navy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#d97706" />
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#64748b" />
    </marker>

    <!-- Drop Shadows & Filters -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="gate-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d97706" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. TOP HEADER BAND (Y: 20 - 75)                                        -->
  <!-- ===================================================================== -->
  <g id="header-band">
    <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Bug Fixer — From Issue to Verified Repair</text>
    <text x="40" y="66" font-size="13" font-weight="500" fill="#475569">A local, auditable software repair workflow with sandboxed validation and human review</text>
    <line x1="40" y1="78" x2="1560" y2="78" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <!-- ===================================================================== -->
  <!-- 2. UPPER BAND: EXTERNAL SERVICES & OPERATIONS CONSOLE (Y: 90 - 215)   -->
  <!-- ===================================================================== -->

  <!-- Service A: Docker Isolated Runtime -->
  <g id="svc-docker" transform="translate(320, 92)">
    <rect x="0" y="0" width="270" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="270" height="28" rx="8" fill="#0f172a"/>
    <rect x="0" y="20" width="270" height="8" fill="#0f172a"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">ISOLATED CONTAINER RUNTIME</text>
    <text x="14" y="48" font-size="13" font-weight="700" fill="#0f172a">Docker Engine &amp; Validator Image</text>
    <text x="14" y="66" font-size="11" font-family="'JetBrains Mono', monospace" fill="#0284c7">bugfixer-validator:py313</text>
    <text x="14" y="84" font-size="11" fill="#475569">• Python 3.13 isolated test runner</text>
    <text x="14" y="100" font-size="11" fill="#475569">• Ephemeral read-only volume mounts</text>
  </g>

  <!-- Service B: Ollama Local Model -->
  <g id="svc-ollama" transform="translate(620, 92)">
    <rect x="0" y="0" width="310" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="310" height="28" rx="8" fill="#0f172a"/>
    <rect x="0" y="20" width="310" height="8" fill="#0f172a"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">LOCAL INFERENCE SERVICE</text>
    <text x="14" y="48" font-size="13" font-weight="700" fill="#0f172a">Ollama Local Repair Model</text>
    <text x="14" y="66" font-size="11" font-family="'JetBrains Mono', monospace" fill="#a855f7">qwen2.5-coder:7b (Local / Offline)</text>
    <text x="14" y="84" font-size="11" fill="#475569">• 4-field root-cause diagnosis output</text>
    <text x="14" y="100" font-size="11" fill="#475569">• AST tool invocations (replace_text, write_file)</text>
  </g>

  <!-- Operations Console (Top Right Band) -->
  <g id="operations-console" transform="translate(960, 92)">
    <rect x="0" y="0" width="600" height="112" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="none" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="600" height="28" rx="8" fill="#0369a1"/>
    <rect x="0" y="20" width="600" height="8" fill="#0369a1"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.04em">OPERATOR &amp; JUDGE INTERFACE — OPERATIONS CONSOLE</text>
    
    <!-- 4 Console Feature Badges -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="134" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="10" font-weight="700" fill="#0f172a">System Health</text>
      <text x="8" y="26" font-size="9" fill="#0d9488">Docker • Ollama • Model</text>

      <rect x="142" y="0" width="134" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="150" y="15" font-size="10" font-weight="700" fill="#0f172a">Runs List &amp; Search</text>
      <text x="150" y="26" font-size="9" fill="#475569">Status, repo &amp; provenance</text>

      <rect x="284" y="0" width="140" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="292" y="15" font-size="10" font-weight="700" fill="#0f172a">8-Stage Timeline</text>
      <text x="292" y="26" font-size="9" fill="#475569">Excerpts, diagnosis, edits</text>

      <rect x="432" y="0" width="144" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="440" y="15" font-size="10" font-weight="700" fill="#0f172a">Patch Diff &amp; Replay</text>
      <text x="440" y="26" font-size="9" fill="#16a34a">Syntax diff • Tree ID proof</text>
    </g>

    <!-- Second row in console: Judge Demo Note -->
    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="576" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="10.5" font-weight="600" fill="#1e40af">
        <tspan fill="#d97706" font-weight="700">🛡️ Read-Only Judge Demo Mode:</tspan> Backed by verified saved artifacts; inspects AP002 fix without running local model or Docker
      </text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 3. MAIN WORKFLOW: 5 SEQUENTIAL STAGES (Y: 235 - 655)                  -->
  <!-- ===================================================================== -->

  <!-- ==================================================================- -->
  <!-- STAGE 1: ISSUE INTAKE                                               -->
  <!-- ==================================================================- -->
  <g id="stage-1" transform="translate(40, 235)">
    <!-- Stage Outer Container -->
    <rect x="0" y="0" width="250" height="415" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#0f172a"/>
    <rect x="0" y="24" width="250" height="8" fill="#0f172a"/>
    <!-- Stage Badge & Title -->
    <circle cx="18" cy="16" r="10" fill="#0d9488" />
    <text x="18" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.02em">STAGE 1: ISSUE INTAKE</text>

    <!-- Submitter Options -->
    <text x="14" y="52" font-size="11" font-weight="700" fill="#475569">DEVELOPER SUBMISSION</text>
    
    <rect x="14" y="60" width="222" height="42" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="24" y="78" font-size="11" font-weight="600" fill="#0f172a">GitHub Issue Submission</text>
    <text x="24" y="93" font-size="10" font-family="'JetBrains Mono', monospace" fill="#0284c7">owner/repo#number</text>

    <text x="125" y="116" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">— OR —</text>

    <rect x="14" y="124" width="222" height="42" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="24" y="142" font-size="11" font-weight="600" fill="#0f172a">Local Demonstration Fixture</text>
    <text x="24" y="157" font-size="10" fill="#64748b">Clearly labeled local repo</text>

    <!-- Intake Processor -->
    <g transform="translate(14, 182)">
      <rect x="0" y="0" width="222" height="88" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="10" y="20" font-size="11.5" font-weight="700" fill="#0f172a">Bug Fixer Intake Engine</text>
      <text x="10" y="38" font-size="10.5" fill="#475569">• Parses issue body &amp; reproduction steps</text>
      <text x="10" y="54" font-size="10.5" fill="#475569">• Discovers &amp; locks reproducer test</text>
      <text x="10" y="70" font-size="10.5" fill="#475569">• Computes test hash fingerprint</text>
    </g>

    <!-- Outputs Section -->
    <g transform="translate(14, 285)">
      <rect x="0" y="0" width="222" height="114" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#0f766e">INTAKE ARTIFACT OUTPUTS</text>
      
      <rect x="10" y="28" width="202" height="34" rx="4" fill="#ffffff" stroke="#ccfbf1" stroke-width="1"/>
      <text x="16" y="43" font-size="10" font-weight="700" fill="#0f172a">Issue Context</text>
      <text x="16" y="55" font-size="9.5" fill="#475569">Title, URL, locked reproducer nodeid</text>

      <rect x="10" y="68" width="202" height="34" rx="4" fill="#ffffff" stroke="#ccfbf1" stroke-width="1"/>
      <text x="16" y="83" font-size="10" font-weight="700" fill="#0f172a">Pinned Commit</text>
      <text x="16" y="95" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#0d9488">base_sha (e.g. 53b3025...)</text>
    </g>
  </g>

  <!-- Solid Teal Connector 1 -> 2 -->
  <line x1="290" y1="442" x2="320" y2="442" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)" />
  <text x="305" y="434" font-size="9" font-weight="700" fill="#0d9488" text-anchor="middle">Base Pin</text>

  <!-- ==================================================================- -->
  <!-- STAGE 2: REPRODUCE THE FAILURE                                      -->
  <!-- ==================================================================- -->
  <g id="stage-2" transform="translate(320, 235)">
    <rect x="0" y="0" width="270" height="415" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="270" height="32" rx="8" fill="#0f172a"/>
    <rect x="0" y="24" width="270" height="8" fill="#0f172a"/>
    <circle cx="18" cy="16" r="10" fill="#0d9488" />
    <text x="18" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.02em">STAGE 2: REPRODUCE FAILURE</text>

    <!-- Workspace & Container Run -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="242" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="700" fill="#0f172a">Isolated Workspace Sandbox</text>
      <text x="10" y="34" font-size="10.5" fill="#475569">• Ephemeral clone at pinned base SHA</text>
      <text x="10" y="49" font-size="10.5" fill="#475569">• Clean pristine working copy (0 edits)</text>
    </g>

    <!-- Downward arrow from Docker Engine above -->
    <line x1="135" y1="-31" x2="135" y2="120" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-slate)" />
    <text x="145" y="-12" font-size="9" font-weight="600" fill="#0284c7">Run Docker Test</text>

    <g transform="translate(14, 122)">
      <rect x="0" y="0" width="242" height="64" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="700" fill="#0f172a">Docker Base Execution</text>
      <text x="10" y="34" font-size="10.5" fill="#475569">• Runs reproducer in isolation</text>
      <text x="10" y="49" font-size="10.5" fill="#475569">• Captures exit code, stdout, stack trace</text>
    </g>

    <!-- Decision Gate: Failure Reason Check -->
    <g transform="translate(14, 198)">
      <rect x="0" y="0" width="242" height="202" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" filter="url(#gate-glow)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#b45309">DECISION: FAILURE REASON GATE</text>

      <!-- Path A: Expected Defect Failure -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="222" height="74" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#15803d">✓ Expected Defect Failure</text>
        <text x="10" y="34" font-size="10" fill="#166534">• Fails with expected AssertionError</text>
        <text x="10" y="48" font-size="10" fill="#166534">• Signature matches issue defect</text>
        <text x="10" y="64" font-size="10" font-weight="700" fill="#0f766e">→ Lock reproducer &amp; proceed to Stage 3</text>
      </g>

      <!-- Path B: Environment / Collection Failure -->
      <g transform="translate(10, 114)">
        <rect x="0" y="0" width="222" height="76" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#b91c1c">✗ Environment / Setup Crash</text>
        <text x="10" y="33" font-size="9.5" fill="#991b1b">• Missing dependency, timeout, crash</text>
        <text x="10" y="46" font-size="9.5" fill="#991b1b">• Non-AssertionError (ZeroDivisionError)</text>
        <text x="10" y="62" font-size="10" font-weight="700" fill="#dc2626">→ Marked 'Environment Error'; Halt</text>
      </g>
    </g>
  </g>

  <!-- Solid Teal Connector 2 -> 3 -->
  <line x1="590" y1="442" x2="620" y2="442" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)" />
  <text x="605" y="434" font-size="9" font-weight="700" fill="#0d9488" text-anchor="middle">Reproduced</text>

  <!-- ==================================================================- -->
  <!-- STAGE 3: LOCATE AND REPAIR                                          -->
  <!-- ==================================================================- -->
  <g id="stage-3" transform="translate(620, 235)">
    <rect x="0" y="0" width="310" height="415" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="310" height="32" rx="8" fill="#0f172a"/>
    <rect x="0" y="24" width="310" height="8" fill="#0f172a"/>
    <circle cx="18" cy="16" r="10" fill="#0d9488" />
    <text x="18" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.02em">STAGE 3: LOCATE &amp; REPAIR</text>

    <!-- Component 1: Traceback & AST Retrieval -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="282" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="700" fill="#0f172a">Traceback &amp; AST Retrieval</text>
      <text x="10" y="34" font-size="10.5" fill="#475569">• Traces failing frame to target callee</text>
      <text x="10" y="49" font-size="10.5" fill="#475569">• Resolves import AST hierarchy &amp; definitions</text>
      <text x="10" y="62" font-size="10" font-family="'JetBrains Mono', monospace" fill="#0d9488">→ Builds Source-Excerpt Packet (SHA-256)</text>
    </g>

    <!-- Downward arrow from Ollama Local Model above -->
    <line x1="155" y1="-31" x2="155" y2="120" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-slate)" />
    <text x="165" y="-12" font-size="9" font-weight="600" fill="#a855f7">Model Prompt &amp; Inference</text>

    <!-- Component 2: Repair Workflow & Attempt State -->
    <g transform="translate(14, 122)">
      <rect x="0" y="0" width="282" height="116" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11.5" font-weight="700" fill="#0f172a">Repair Workflow &amp; Attempt State</text>
      <text x="10" y="34" font-size="10.5" fill="#475569">• Manages attempt budget (Attempt 1 / 2)</text>
      <text x="10" y="49" font-size="10.5" fill="#475569">• Dispatches context packet to Qwen 2.5 Coder</text>
      
      <!-- 4-Part Diagnosis Output Box -->
      <rect x="8" y="56" width="266" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="70" font-size="10" font-weight="700" fill="#0f172a">4-Part Structured Diagnosis:</text>
      <text x="14" y="84" font-size="9" fill="#475569">1. Root cause • 2. Evidence IDs</text>
      <text x="14" y="96" font-size="9" fill="#475569">3. Next check/edit • 4. Expected observable result</text>
    </g>

    <!-- Component 3: Workspace Tools & Candidate Patch -->
    <g transform="translate(14, 250)">
      <rect x="0" y="0" width="282" height="96" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="700" fill="#0f766e">Workspace Tools &amp; Candidate Patch</text>
      <text x="10" y="34" font-size="10.5" fill="#475569">• Executes surgical tool edits:</text>
      <text x="18" y="49" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#0f172a">replace_text, replace_line, write_file</text>
      <text x="10" y="66" font-size="10.5" fill="#475569">• Protects tests &amp; unreferenced files from edit</text>
      <text x="10" y="82" font-size="10" font-weight="700" fill="#0d9488">→ Candidate Unified Patch Diff Produced</text>
    </g>

    <!-- Retry Loop Annotation Box -->
    <g transform="translate(14, 356)">
      <rect x="0" y="0" width="282" height="46" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#b91c1c">Attempt Retry Feedback Loop:</text>
      <text x="10" y="32" font-size="9.5" fill="#7f1d1d">Reverts edit on failure &amp; feeds error stack to Attempt 2</text>
    </g>
  </g>

  <!-- Solid Teal Connector 3 -> 4 -->
  <line x1="930" y1="442" x2="960" y2="442" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)" />
  <text x="945" y="434" font-size="9" font-weight="700" fill="#0d9488" text-anchor="middle">Patch</text>

  <!-- Dashed Red Feedback Loop: Stage 4 failure back to Stage 3 -->
  <path d="M 1000 590 L 1000 620 L 780 620 L 780 405" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="890" y="614" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">Validation Failure &amp; Retry Feedback</text>

  <!-- ==================================================================- -->
  <!-- STAGE 4: VERIFY THE PATCH (PROMINENT AMBER SAFETY GATE)             -->
  <!-- ==================================================================- -->
  <g id="stage-4" transform="translate(960, 235)">
    <!-- Prominent Safety Gate Outline -->
    <rect x="0" y="0" width="290" height="415" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" filter="url(#gate-glow)"/>
    <rect x="0" y="0" width="290" height="32" rx="8" fill="#b45309"/>
    <rect x="0" y="24" width="290" height="8" fill="#b45309"/>
    <circle cx="18" cy="16" r="10" fill="#f59e0b" />
    <text x="18" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="36" y="21" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.02em">STAGE 4: VERIFY THE PATCH</text>

    <text x="14" y="50" font-size="11" font-weight="700" fill="#92400e">INDEPENDENT REPLAY SAFETY GATE</text>

    <!-- 5-Step Independent Verification Checklist -->
    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="262" height="236" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">5-Step Replay Protocol:</text>

      <g transform="translate(12, 32)">
        <circle cx="6" cy="6" r="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="6" y="9" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">1</text>
        <text x="18" y="9" font-size="10.5" font-weight="600" fill="#0f172a">Clean checkout of pinned base</text>
